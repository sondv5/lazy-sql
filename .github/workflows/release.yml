name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-14
            # universal binary: runs on Apple Silicon and Intel
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci

      # the engine bundle is a build artifact (not committed) and a Tauri resource
      - run: npm run bundle

      # Only export the Apple signing vars when the secrets are actually configured —
      # an empty APPLE_CERTIFICATE makes the bundler try (and fail) to import a certificate.
      - name: Configure Apple signing
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then echo "$name=$value" >> "$GITHUB_ENV"; fi
          done

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      # normalize bundle names for the release page:
      # "LAZY SQL_0.2.0_x64-setup.exe" -> "LAZY-SQL-0.2.0-win-x64-setup.exe"
      - name: Collect installers with release names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r file; do
            base="$(basename "$file")"
            clean="$(echo "$base" | sed -E \
              -e 's/^LAZY SQL_/LAZY-SQL-/' \
              -e 's/_x64-setup\.exe$/-win-x64-setup.exe/' \
              -e 's/_x64_en-US\.msi$/-win-x64.msi/' \
              -e 's/_universal\.dmg$/-macos-universal.dmg/' \
              -e 's/_aarch64\.dmg$/-macos-arm64.dmg/' \
              -e 's/_x64\.dmg$/-macos-x64.dmg/')"
            cp "$file" "release-assets/$clean"
          done < <(find apps/desktop/src-tauri/target -path '*/release/bundle/*' -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \))
          ls -l release-assets

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
